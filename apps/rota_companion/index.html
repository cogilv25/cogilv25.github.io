	// Loads all data from all the rotas excluding the MASTER folder. 
	//  The function will return false if it detects the folder 
	//  selected is not the top level CCR Rota folder.
	async function loadRotas(files)
	{
		for (const file of files)
		{
			const parts = file.webkitRelativePath.split("/");
			if(/^\d{4}$/.test(parts[1]))
			{
				const year = parseInt(parts[1],10) - 2026;

				if(years[year] == null)
				{
					years[year] = parts[1];
					payPeriodRotaFiles[year] = [];
					payLabels[year] = [];
					months[year] = ["January","Feburary","March","April","May","June","July","August","September","October","November","December"];
					workbooks[year] = [];
				}

				if(file.name === "MASTER ROTA PATTERN.xlsx")
				{
					masterRotaFiles[year] = file;
				}
				else
				{
					const match = file.name.match(/^\d+/);

					if(match)
						payPeriodRotaFiles[year][parseInt(match[0], 10)] = file;
				}

				if (!/^\d{2}\..*\.xlsx$/i.test(file.name) && !(file.name === "MASTER ROTA PATTERN.xlsx"))
					continue;

				let index = 12;
				let wbLabel = "Master";
				match = file.name.match(/^(\d{2})\..*$/i);
				if(match)
				{
					index = Number(match[1]) - 1;
					wbLabel = months[year][index];
				}

				const data = await file.arrayBuffer();
				workbooks[year][index] = [wbLabel, XLSX.read(data, { type: "array", cellDates: true})];

			}
			else if(parts[1] !== "MASTER")
			{
				console.log(file.webkitRelativePath + " ? " + parts[1]);
				return false;
			}
		}

		for(let month = 0; month < 12; ++month)
		{
			payLabels[0][month] = [];
			if(workbooks[0][month] == null) continue;
			const wb = workbooks[0][month];
			for(const wsName of wb[1].SheetNames)
			{
				const ws = wb[1].Sheets[wsName];
				const weekBegin = ws.C4?.v;
				const weekEnd = ws.AM4?.v;

				if(weekBegin instanceof Date && weekEnd	instanceof Date)
				{
					let pLbl = weekBegin.toLocaleDateString() + " -> " + weekEnd.toLocaleDateString();
					console.log(wb[0] + ": " + pLbl);
					payLabels[0][month].push(pLbl);
				}
			}
		}

		// TODO: Process rotas using SheetJS
		return true;
	}
